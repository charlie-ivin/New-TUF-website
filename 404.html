<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Thumbs Up Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

    margin:0 auto;

    font-family:'Fredoka',sans-serif;
    font-weight:700;

    font-size:1.1rem;
    max-width:46ch;
    margin:0 auto 30px;
  }
  .notfound .cta-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }

<body>

<nav>
  <div class="brand">👍 Thumbs Up Friday</div>
</nav>

<footer>
