<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>TUF Hub — Thumbs Up Friday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" type="image/png" href="assets/2.png">
<style>
  :root{ --go:#2E9E5B; --oven:#E07B22; }

  html{height:100%;}
  body.hub{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
  .nav-date{
    color:var(--cream);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:clamp(1rem,1.6vw,1.4rem);
  }

  .hub-main{
    flex:none;
    width:100%;
    max-width:1500px;
    margin:0 auto;
    transform-origin:0 0;
    padding:clamp(14px,2vw,28px);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(14px,2vw,26px);
    align-content:start;
  }
  .panel{
    background:var(--card-bg);
    border:2px solid #f0e6d2;
    border-radius:22px;
    padding:clamp(18px,2.2vw,32px);
    box-shadow:0 12px 30px rgba(62,39,35,0.08);
  }
  .h-label{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:clamp(.8rem,1.1vw,1rem);
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:8px;
  }

  /* CLOCK */
  .clock-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .clock{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(4.5rem,12vw,10rem);
    line-height:1;
    color:var(--choc);
    font-variant-numeric:tabular-nums;
  }
  .clock small{
    font-size:.32em;
    color:var(--mustard);
    margin-left:.12em;
  }

  /* REGISTER */
  .register-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:clamp(12px,1.6vw,20px);
  }
  .reg-row{display:flex;align-items:center;gap:clamp(14px,2vw,26px);}
  .tick{
    width:clamp(72px,9vw,120px);
    height:clamp(72px,9vw,120px);
    border-radius:50%;
    border:6px solid #d9cdb5;
    color:#d9cdb5;
    display:grid;
    place-items:center;
    flex-shrink:0;
    transition:background .3s ease, border-color .3s ease, color .3s ease, transform .3s ease;
  }
  .tick svg{width:62%;height:62%;}
  .register-panel.done .tick{
    background:var(--go);
    border-color:var(--go);
    color:#fff;
    transform:scale(1.06);
  }
  .reg-text{text-align:left;}
  .reg-text h2{
    font-size:clamp(1.6rem,3vw,2.6rem);
    line-height:1.1;
    margin-bottom:4px;
  }
  .reg-status{
    font-size:clamp(1rem,1.7vw,1.5rem);
    color:#8a7a6a;
  }
  .register-panel.done .reg-status{color:var(--go);font-weight:700;}
  .big-btn{font-size:clamp(1.1rem,1.9vw,1.7rem);padding:clamp(12px,1.4vw,18px) clamp(26px,3vw,44px);}
  .reset{
    background:none;
    border:0;
    color:#8a7a6a;
    text-decoration:underline;
    cursor:pointer;
    font:inherit;
    font-size:.9rem;
  }

  /* NOW / NEXT */
  .h-title{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(1.6rem,3.4vw,3rem);
    line-height:1.1;
    margin-bottom:8px;
    overflow-wrap:anywhere;
  }
  .h-meta{
    color:#5a4038;
    font-size:clamp(1rem,1.7vw,1.5rem);
  }
  .now-panel.live{
    background:#FFF3DC;
    border-color:var(--mustard);
  }

  /* OVEN (inside Happening now) */
  /* Fixed-size so oven rows appearing never change the page layout */
  .now-panel{
    grid-column:1 / -1;
    height:clamp(170px,26vh,300px);
    overflow:auto;
  }
  .oven-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));
    gap:6px 24px;
  }
  .oven-list:not(:empty){margin-bottom:8px;}
  .oven-row{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(1.2rem,2.3vw,2.1rem);
    line-height:1.15;
    color:var(--choc);
    overflow-wrap:anywhere;
  }
  .oven-row .oven-time{
    color:var(--oven);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  /* FULL SCREEN BUTTON */
  .fs-btn{
    position:fixed;
    right:12px;
    bottom:12px;
    z-index:50;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:.95rem;
    padding:8px 16px;
    border-radius:999px;
    border:2px solid rgba(255,255,255,.6);
    background:rgba(62,39,35,.78);
    color:#fff;
    cursor:pointer;
    opacity:.7;
    transition:opacity .2s ease;
  }
  .fs-btn:hover, .fs-btn:focus-visible{opacity:1;}

  /* EXIT CODE KEYPAD */
  .pin-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(62,39,35,.82);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pin-overlay[hidden]{display:none;}
  .pin-box{
    background:var(--card-bg,#fff);
    border-radius:22px;
    padding:clamp(18px,3vh,32px) clamp(20px,3vw,36px);
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    width:min(92vw,340px);
  }
  .pin-title{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:1.4rem;
    color:var(--choc);
    margin-bottom:12px;
  }
  .pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:16px;}
  .pin-dots span{
    width:18px;height:18px;border-radius:50%;
    border:3px solid #d9cdb5;
    transition:background .15s ease,border-color .15s ease;
  }
  .pin-dots span.on{background:var(--choc);border-color:var(--choc);}
  .pin-box.bad{animation:pinshake .35s;}
  .pin-box.bad .pin-dots span{border-color:#c0392b;background:#c0392b;}
  @keyframes pinshake{
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-10px);}
    40%,80%{transform:translateX(10px);}
  }
  .pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pin-keys button{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:1.5rem;
    padding:14px 0;
    border-radius:14px;
    border:2px solid #d9cdb5;
    background:#fff;
    color:var(--choc);
    cursor:pointer;
  }
  .pin-keys button:active{background:var(--mustard);border-color:var(--mustard);}
  .pin-keys button.small{font-size:.95rem;color:#8a7a6a;}

  /* FOOD */
  .food-panel{grid-column:1 / -1;}
  .food-head{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .food-head .h-label{margin-bottom:0;}
  .food-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .food-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;
  }
  .food{
    background:#fff;
    border:2px solid #f0e6d2;
    border-radius:18px;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:border-color .3s ease, background .3s ease, opacity .3s ease;
  }
  .food-name{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(1.2rem,1.9vw,1.7rem);
    line-height:1.1;
    color:var(--choc);
  }
  .food-name small{
    font-size:.55em;
    font-weight:600;
    color:var(--sage);
    margin-left:.4em;
  }
  .food-status{
    font-size:clamp(.95rem,1.3vw,1.15rem);
    color:#8a7a6a;
    min-height:1.4em;
  }
  .food.s-started{border-color:var(--mustard);}
  .food.s-started .food-status{color:#a87a00;font-weight:700;}
  .food.s-oven{border-color:var(--oven);background:#FFF3E6;}
  .food.s-oven .food-status{color:var(--oven);font-weight:700;}
  .food.s-ready{border-color:var(--go);background:#EEF9F2;}
  .food.s-ready .food-status{color:var(--go);font-weight:700;}
  .food.skipped{opacity:.55;background:#f6f1e6;border-style:dashed;}
  .food.skipped .food-status{font-weight:700;color:#8a7a6a;}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .step{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:clamp(.85rem,1.1vw,1rem);
    line-height:1.15;
    padding:12px 6px;
    border-radius:12px;
    border:2px solid #d9cdb5;
    background:#fff;
    color:#5a4038;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .step:hover:not(:disabled){border-color:var(--choc);}
  .step .st{font-size:.8em;font-weight:500;min-height:1.1em;}
  .step.on{color:#fff;}
  .step[data-step="started"].on{background:var(--mustard);border-color:var(--mustard);}
  .step[data-step="oven"].on{background:var(--oven);border-color:var(--oven);}
  .step[data-step="ready"].on{background:var(--go);border-color:var(--go);}
  .step:disabled{cursor:not-allowed;opacity:.6;}
  .skip-btn{
    align-self:flex-start;
    background:none;
    border:0;
    padding:0;
    color:#8a7a6a;
    text-decoration:underline;
    cursor:pointer;
    font:inherit;
    font-size:.9rem;
  }

  /* SCHEDULE */
  .schedule-panel{grid-column:1 / -1;}
  .sched{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:12px;
  }
  .ev{
    display:flex;
    gap:14px;
    align-items:baseline;
    padding:12px 16px;
    border-radius:14px;
    background:#fff;
    border:2px solid #f0e6d2;
    font-size:clamp(1rem,1.5vw,1.3rem);
  }
  .ev .t{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    color:var(--choc);
    min-width:3.4em;
  }
  .ev.past{opacity:.45;}
  .ev.now{background:var(--mustard);border-color:var(--mustard);}
  .ev.next{border-color:var(--mustard);}
  .empty{color:#8a7a6a;font-size:1.1rem;}

  /* PRINT REPORT (hidden on screen) */
  #print-report{display:none;}

  @media (max-width:800px){
    .hub-main{grid-template-columns:1fr;}
    .reg-row{flex-direction:column;text-align:center;}
    .reg-text{text-align:center;}
  }

  @media print{
    @page{margin:16mm;}
    body.hub > nav, body.hub > .hub-main, .fs-btn, .pin-overlay{display:none !important;}
    body.hub{display:block;height:auto;min-height:0;overflow:visible;background:#fff !important;}
    #print-report{
      display:block;
      font-family:'Inter',Arial,sans-serif;
      color:#000;
    }
    #print-report h1{
      font-family:'Fredoka',Arial,sans-serif;
      font-size:22pt;
      margin:0 0 4px;
    }
    #print-report .sub{font-size:11pt;color:#444;margin-bottom:18px;}
    #print-report table{width:100%;border-collapse:collapse;font-size:11pt;}
    #print-report th, #print-report td{
      border:1px solid #999;
      padding:8px 10px;
      text-align:left;
    }
    #print-report th{background:#eee;}
    #print-report tr.skip td{color:#777;font-style:italic;}
    #print-report .foot{margin-top:16px;font-size:9pt;color:#666;}
  }
</style>
</head>
<body class="hub">

<nav>
  <div class="brand">👍 Thumbs Up Friday — Hub</div>
  <div class="nav-date" id="date"></div>
</nav>

<main class="hub-main">

  <section class="panel clock-panel">
    <div class="clock" id="clock">--:--</div>
  </section>

  <section class="panel register-panel" id="register-panel">
    <div class="reg-row">
      <div class="tick" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="reg-text">
        <h2>Register</h2>
        <div class="reg-status" id="reg-status">Not taken yet</div>
      </div>
    </div>
    <a class="btn btn-primary big-btn" id="reg-btn" href="#" target="_blank" rel="noopener">Take Register</a>
    <button class="reset" id="reg-reset" type="button" hidden>Reset tick</button>
  </section>

  <section class="panel now-panel" id="now-panel">
    <div class="h-label">Happening now</div>
    <div class="oven-list" id="oven-list"></div>
    <div class="h-title" id="now-title">—</div>
    <div class="h-meta" id="now-meta"></div>
  </section>

  <section class="panel food-panel">
    <div class="food-head">
      <div class="h-label">Food</div>
      <div class="food-actions">
        <button class="btn btn-primary" id="print-btn" type="button">Print week report (PDF)</button>
        <button class="reset" id="food-reset" type="button">Reset this week</button>
      </div>
    </div>
    <div class="food-grid" id="food-grid"></div>
  </section>

</main>

<button class="fs-btn" id="fs-btn" type="button" aria-label="Toggle full screen">⛶ Full screen</button>

<div class="pin-overlay" id="pin-overlay" hidden>
  <div class="pin-box" id="pin-box" role="dialog" aria-label="Enter code to exit full screen">
    <div class="pin-title">Enter code to exit</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="pin-keys" id="pin-keys"></div>
  </div>
</div>

<div id="print-report"></div>

<script>
(function () {
  // Used only if content/hub.json can't be loaded (e.g. the screen is offline).
  var DEFAULT_REGISTER_URL = 'https://docs.google.com/spreadsheets/d/1R7_71nVOLdocqbKiXY1IwyIRn_LudvZw7CSWH6aljp4/edit?usp=sharing';
  var STORAGE_KEY = 'tuf-register-v1';
  var FOOD_KEY = 'tuf-food-v1';

  var FOODS = [
    { id: 'brownies',     name: 'Brownies',      note: 'gluten free' },
    { id: 'chelsea',      name: 'Chelsea buns' },
    { id: 'cupcakes',     name: 'Cupcakes' },
    { id: 'sausage',      name: 'Sausage rolls' },
    { id: 'cheese',       name: 'Cheese twists' },
    { id: 'cakepops',     name: 'Cake pops' }
  ];
  var STEPS = [
    { id: 'started', label: 'Starting',          done: 'Started' },
    { id: 'oven',    label: 'In oven',           done: 'In oven since' },
    { id: 'ready',   label: 'Ready for serving', done: 'Ready for serving at' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };

  // ---------- cookies (with localStorage as a backup) ----------
  function setCookie(name, value, days) {
    try {
      document.cookie = name + '=' + encodeURIComponent(value) +
        '; max-age=' + Math.round(days * 86400) + '; path=/; SameSite=Lax';
    } catch (e) {}
  }
  function getCookie(name) {
    try {
      var parts = document.cookie ? document.cookie.split('; ') : [];
      for (var i = 0; i < parts.length; i++) {
        var eq = parts[i].indexOf('=');
        if (parts[i].slice(0, eq) === name) return decodeURIComponent(parts[i].slice(eq + 1));
      }
    } catch (e) {}
    return null;
  }
  function cookieNames(prefix) {
    var out = [];
    try {
      (document.cookie ? document.cookie.split('; ') : []).forEach(function (p) {
        var n = p.slice(0, p.indexOf('='));
        if (n.indexOf(prefix) === 0) out.push(n);
      });
    } catch (e) {}
    return out;
  }
  function delCookie(name) {
    try { document.cookie = name + '=; max-age=0; path=/; SameSite=Lax'; } catch (e) {}
  }

  // ---------- time helpers ----------
  function toSec(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '').trim());
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return h * 3600 + mi * 60;
  }
  function fmt(sec) {
    sec = sec % 86400;
    return pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor((sec % 3600) / 60));
  }
  function untilText(sec) {
    if (sec < 600) return 'in ' + Math.floor(sec / 60) + ':' + pad(sec % 60);
    var mins = Math.ceil(sec / 60);
    if (mins < 60) return 'in ' + mins + ' min';
    var h = Math.floor(mins / 60), m = mins % 60;
    return 'in ' + h + ' h' + (m ? ' ' + m + ' min' : '');
  }
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function nowHM() {
    var d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  // Monday of the current week, as YYYY-MM-DD
  function weekStart(d) {
    d = d ? new Date(d.getTime()) : new Date();
    d.setHours(12, 0, 0, 0);
    var day = (d.getDay() + 6) % 7; // Mon=0 ... Sun=6
    d.setDate(d.getDate() - day);
    return todayStr(d);
  }

  // ---------- oven timers (shown in "Happening now") ----------
  var lastOvenCount = -1;

  function elapsedText(secs) {
    var h = Math.floor(secs / 3600);
    var m = Math.floor((secs % 3600) / 60);
    var s = secs % 60;
    return (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
  }

  // Foods that are in the oven (not yet ready, not skipped), with seconds elapsed
  function ovenItems() {
    var items = weekItems();
    var out = [];
    FOODS.forEach(function (f) {
      var it = items[f.id];
      if (!it || !it.oven || it.ready || it.skip) return;
      var secs;
      if (it.ovenTs) {
        secs = Math.floor((Date.now() - it.ovenTs) / 1000);
      } else {
        var d = new Date();
        secs = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() - (toSec(it.oven) || 0);
      }
      out.push({ name: f.name, secs: Math.max(0, secs) });
    });
    return out;
  }

  // ---------- events ----------
  // An event is "on" from its start until its end time. If no end time is
  // given it runs until the next event starts; the last event with no end
  // time is treated as lasting 30 minutes.
  var events = [];
  var rows = [];

  function prepareEvents(list) {
    var evs = (list || []).map(function (e) {
      return { title: e.title || '', time: e.time, start: toSec(e.time), endRaw: toSec(e.end) };
    }).filter(function (e) { return e.start !== null && e.title; })
      .sort(function (a, b) { return a.start - b.start; });
    evs.forEach(function (e, i) {
      var nextStart = evs[i + 1] ? evs[i + 1].start : null;
      if (e.endRaw !== null && e.endRaw > e.start) e.end = e.endRaw;
      else if (nextStart !== null && nextStart > e.start) e.end = nextStart;
      else e.end = e.start + 1800;
    });
    return evs;
  }

  function buildSchedule() {
    var el = $('sched');
    rows = [];
    if (!el) return; // schedule panel removed from the page
    el.textContent = '';
    if (!events.length) {
      var p = document.createElement('div');
      p.className = 'empty';
      p.textContent = 'No events added yet.';
      el.appendChild(p);
      return;
    }
    events.forEach(function (e) {
      var row = document.createElement('div');
      row.className = 'ev';
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = fmt(e.start);
      var n = document.createElement('span');
      n.textContent = e.title;
      row.appendChild(t);
      row.appendChild(n);
      el.appendChild(row);
      rows.push(row);
    });
  }

  function renderEvents(nowSec) {
    var cur = null, nxt = null;
    events.forEach(function (e) { if (nowSec >= e.start && nowSec < e.end) cur = e; });
    for (var i = 0; i < events.length; i++) {
      if (events[i].start > nowSec) { nxt = events[i]; break; }
    }

    // Happening now
    var nowPanel = $('now-panel');
    var ovens = ovenItems();
    var ovenEl = $('oven-list');
    ovenEl.textContent = '';
    ovens.forEach(function (o) {
      var row = document.createElement('div');
      row.className = 'oven-row';
      row.appendChild(document.createTextNode('🔥 ' + o.name + ' in oven for '));
      var tm = document.createElement('span');
      tm.className = 'oven-time';
      tm.textContent = elapsedText(o.secs);
      row.appendChild(tm);
      ovenEl.appendChild(row);
    });

    var titleEl = $('now-title');
    nowPanel.classList.toggle('live', !!(cur || ovens.length));
    if (cur) {
      titleEl.style.display = '';
      titleEl.textContent = cur.title;
      $('now-meta').textContent = 'Until ' + fmt(cur.end);
    } else if (ovens.length) {
      titleEl.style.display = 'none';
      $('now-meta').textContent = '';
    } else {
      titleEl.style.display = '';
      titleEl.textContent = 'Nothing right now';
      $('now-meta').textContent = '';
    }

    // Schedule highlights
    events.forEach(function (e, i) {
      var cls = 'ev';
      if (nowSec >= e.end) cls += ' past';
      else if (nowSec >= e.start) cls += ' now';
      else if (e === nxt) cls += ' next';
      if (rows[i] && rows[i].className !== cls) rows[i].className = cls;
    });
  }

  // ---------- register tick ----------
  var registerUrl = DEFAULT_REGISTER_URL;
  var regBtn = $('reg-btn');
  regBtn.href = registerUrl;

  function loadReg() {
    var raw = getCookie(STORAGE_KEY);
    if (raw === null) {
      try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    }
    try {
      var v = JSON.parse(raw);
      if (v && v.date === todayStr()) return v;
    } catch (e) {}
    return null;
  }
  function saveReg(v) {
    if (v) setCookie(STORAGE_KEY, JSON.stringify(v), 2);
    else delCookie(STORAGE_KEY);
    try {
      if (v) localStorage.setItem(STORAGE_KEY, JSON.stringify(v));
      else localStorage.removeItem(STORAGE_KEY);
    } catch (e) {}
  }

  var reg = loadReg();

  function renderReg() {
    var panel = $('register-panel');
    if (reg) {
      panel.classList.add('done');
      $('reg-status').textContent = 'Register opened at ' + reg.time;
      regBtn.textContent = 'Open Register Again';
      $('reg-reset').hidden = false;
    } else {
      panel.classList.remove('done');
      $('reg-status').textContent = 'Not taken yet';
      regBtn.textContent = 'Take Register';
      $('reg-reset').hidden = true;
    }
  }

  regBtn.addEventListener('click', function () {
    var d = new Date();
    reg = { date: todayStr(d), time: pad(d.getHours()) + ':' + pad(d.getMinutes()) };
    saveReg(reg);
    renderReg();
  });
  $('reg-reset').addEventListener('click', function () {
    reg = null;
    saveReg(null);
    renderReg();
  });

  // ---------- food tracker ----------
  // Stored as { weeks: { 'YYYY-MM-DD (Monday)': { foodId: { skip, started, oven, ready } } } }
  var foodData = loadFood();
  var currentWeek = weekStart();

  function loadFood() {
    var data = { weeks: {} };
    // localStorage backup first, then cookies (one cookie per week) win
    try {
      var v = JSON.parse(localStorage.getItem(FOOD_KEY));
      if (v && v.weeks) data = v;
    } catch (e) {}
    cookieNames(FOOD_KEY + '-').forEach(function (n) {
      try {
        var items = JSON.parse(getCookie(n));
        if (items) data.weeks[n.slice(FOOD_KEY.length + 1)] = items;
      } catch (e) {}
    });
    return data;
  }
  function saveFood() {
    // keep only the latest 12 weeks
    var keys = Object.keys(foodData.weeks).sort();
    while (keys.length > 12) {
      var old = keys.shift();
      delete foodData.weeks[old];
      delCookie(FOOD_KEY + '-' + old);
    }
    if (foodData.weeks[currentWeek]) {
      setCookie(FOOD_KEY + '-' + currentWeek, JSON.stringify(foodData.weeks[currentWeek]), 120);
    }
    try { localStorage.setItem(FOOD_KEY, JSON.stringify(foodData)); } catch (e) {}
  }
  function weekItems() {
    if (!foodData.weeks[currentWeek]) foodData.weeks[currentWeek] = {};
    return foodData.weeks[currentWeek];
  }
  function itemFor(id) {
    var items = weekItems();
    if (!items[id]) items[id] = {};
    return items[id];
  }
  function statusOf(it) {
    if (it.skip) return 'skipped';
    if (it.ready) return 'ready';
    if (it.oven) return 'oven';
    if (it.started) return 'started';
    return 'none';
  }
  function statusText(it) {
    var s = statusOf(it);
    if (s === 'skipped') return 'Not making this week';
    if (s === 'ready') return 'Ready for serving at ' + it.ready;
    if (s === 'oven') return 'In oven since ' + it.oven;
    if (s === 'started') return 'Started at ' + it.started;
    return 'Not started';
  }

  function renderFood() {
    var grid = $('food-grid');
    grid.textContent = '';
    FOODS.forEach(function (f) {
      var it = itemFor(f.id);
      var s = statusOf(it);

      var card = document.createElement('div');
      card.className = 'food' + (s === 'skipped' ? ' skipped' : (s !== 'none' ? ' s-' + s : ''));

      var name = document.createElement('div');
      name.className = 'food-name';
      name.textContent = f.name;
      if (f.note) {
        var sm = document.createElement('small');
        sm.textContent = f.note;
        name.appendChild(sm);
      }

      var status = document.createElement('div');
      status.className = 'food-status';
      status.textContent = statusText(it);

      var steps = document.createElement('div');
      steps.className = 'steps';
      STEPS.forEach(function (st) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'step' + (it[st.id] ? ' on' : '');
        b.setAttribute('data-step', st.id);
        b.disabled = !!it.skip;
        var l = document.createElement('span');
        l.textContent = st.label;
        var t = document.createElement('span');
        t.className = 'st';
        t.textContent = it[st.id] || '';
        b.appendChild(l);
        b.appendChild(t);
        b.addEventListener('click', function () {
          var cur = itemFor(f.id);
          if (cur[st.id]) {                        // tap again to undo
            delete cur[st.id];
            if (st.id === 'oven') delete cur.ovenTs;
          } else {
            cur[st.id] = nowHM();
            if (st.id === 'oven') cur.ovenTs = Date.now();
          }
          saveFood();
          renderFood();
        });
        steps.appendChild(b);
      });

      var skip = document.createElement('button');
      skip.type = 'button';
      skip.className = 'skip-btn';
      skip.textContent = it.skip ? 'Make this week after all' : 'Not making this week';
      skip.addEventListener('click', function () {
        var cur = itemFor(f.id);
        cur.skip = !cur.skip;
        if (!cur.skip) delete cur.skip;
        saveFood();
        renderFood();
      });

      card.appendChild(name);
      card.appendChild(status);
      card.appendChild(steps);
      card.appendChild(skip);
      grid.appendChild(card);
    });
    scheduleFit();
  }

  $('food-reset').addEventListener('click', function () {
    if (!confirm('Clear all food ticks and "not this week" marks for this week?')) return;
    delete foodData.weeks[currentWeek];
    delCookie(FOOD_KEY + '-' + currentWeek);
    saveFood();
    renderFood();
  });

  // ---------- weekly report (print / save as PDF) ----------
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function buildReport() {
    var box = $('print-report');
    box.textContent = '';

    var monday = new Date(currentWeek + 'T12:00:00');
    var fri = new Date(monday.getTime());
    fri.setDate(fri.getDate() + 4);
    var opts = { day: 'numeric', month: 'long', year: 'numeric' };

    box.appendChild(el('h1', '👍 Thumbs Up Friday — Food Report'));
    box.appendChild(el('div',
      'Week commencing ' + monday.toLocaleDateString('en-GB', opts) +
      ' · Friday ' + fri.toLocaleDateString('en-GB', opts), 'sub'));

    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var hr = document.createElement('tr');
    ['Food', 'Status', 'Started', 'In oven', 'Ready for serving'].forEach(function (h) {
      hr.appendChild(el('th', h));
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    FOODS.forEach(function (f) {
      var it = itemFor(f.id);
      var s = statusOf(it);
      var tr = document.createElement('tr');
      if (s === 'skipped') tr.className = 'skip';
      tr.appendChild(el('td', f.name + (f.note ? ' (' + f.note + ')' : '')));
      if (s === 'skipped') {
        tr.appendChild(el('td', 'Not made this week'));
        tr.appendChild(el('td', '—'));
        tr.appendChild(el('td', '—'));
        tr.appendChild(el('td', '—'));
      } else {
        tr.appendChild(el('td',
          s === 'ready' ? 'Ready' : s === 'oven' ? 'In oven' : s === 'started' ? 'Started' : 'Not started'));
        tr.appendChild(el('td', it.started || '—'));
        tr.appendChild(el('td', it.oven || '—'));
        tr.appendChild(el('td', it.ready || '—'));
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.appendChild(table);
  }

  $('print-btn').addEventListener('click', function () {
    buildReport();
    window.print(); // choose "Save as PDF" as the destination
  });

  // ---------- auto-fit: shrink the layout so everything stays in view ----------
  var fitQueued = false;
  function scheduleFit() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function () { fitQueued = false; fit(); });
  }
  function fit() {
    var main = document.querySelector('.hub-main');
    var nav = document.querySelector('body.hub > nav');
    if (!main) return;
    var avail = window.innerHeight - (nav ? nav.offsetHeight : 0) - 2;

    // Does the content fit at scale s? (Widening the box by 1/s keeps it
    // filling the screen width once it has been scaled down.)
    function fits(s) {
      main.style.width = (100 / s) + '%';
      main.style.maxWidth = s < 1 ? 'none' : '';
      return main.offsetHeight * s <= avail;
    }

    main.style.transform = '';
    if (fits(1)) { main.style.width = ''; main.style.maxWidth = ''; return; }

    var lo = 0.25, hi = 1;
    for (var i = 0; i < 10; i++) {
      var mid = (lo + hi) / 2;
      if (fits(mid)) lo = mid; else hi = mid;
    }
    fits(lo);
    main.style.transform = 'scale(' + lo + ')';
  }
  window.addEventListener('resize', scheduleFit);
  window.addEventListener('load', scheduleFit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);

  // ---------- clock ----------
  var currentDay = todayStr();
  var fitTicks = 0;

  // ---------- full screen toggle (button doubles as the way back out) ----------
  var fsBtn = $('fs-btn');
  var fsRoot = document.documentElement;
  var fsSupported = !!(fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen);
  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function updateFs() {
    fsBtn.textContent = isFs() ? '🔒 Exit full screen' : '⛶ Full screen';
    if (!isFs()) {
      closePin();
      try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e) {}
    }
    scheduleFit();
  }
  function exitFs() {
    try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
  }

  // Exit code. Change this to whatever you like (4 digits is the tidiest).
  var EXIT_PIN = '3756';
  var pinEntry = '';
  var pinOverlay = $('pin-overlay');
  var pinBox = $('pin-box');
  var pinDots = $('pin-dots');
  var pinKeys = $('pin-keys');

  function renderPin() {
    pinDots.textContent = '';
    for (var i = 0; i < EXIT_PIN.length; i++) {
      var d = document.createElement('span');
      if (i < pinEntry.length) d.className = 'on';
      pinDots.appendChild(d);
    }
  }
  function openPin() { pinEntry = ''; renderPin(); pinOverlay.hidden = false; }
  function closePin() { pinOverlay.hidden = true; pinEntry = ''; pinBox.classList.remove('bad'); }
  function pinDigit(d) {
    if (pinEntry.length >= EXIT_PIN.length) return;
    pinEntry += d;
    renderPin();
    if (pinEntry.length === EXIT_PIN.length) {
      if (pinEntry === EXIT_PIN) {
        closePin();
        exitFs();
      } else {
        pinBox.classList.add('bad');
        setTimeout(function () { pinBox.classList.remove('bad'); pinEntry = ''; renderPin(); }, 450);
      }
    }
  }
  ['1','2','3','4','5','6','7','8','9','Cancel','0','Clear'].forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = k;
    if (k === 'Cancel' || k === 'Clear') b.className = 'small';
    b.addEventListener('click', function () {
      if (k === 'Cancel') closePin();
      else if (k === 'Clear') { pinEntry = ''; renderPin(); }
      else pinDigit(k);
    });
    pinKeys.appendChild(b);
  });
  document.addEventListener('keydown', function (e) {
    // With Chrome's keyboard lock active, a tap of Esc reaches the page
    // (instead of leaving full screen), so use it to ask for the code.
    if (e.key === 'Escape' && isFs() && pinOverlay.hidden && !e.repeat) { openPin(); return; }
    if (e.key === 'Escape' && !pinOverlay.hidden && !e.repeat) { closePin(); return; }
    if (pinOverlay.hidden) return;
    if (/^[0-9]$/.test(e.key)) pinDigit(e.key);
    else if (e.key === 'Backspace') { pinEntry = pinEntry.slice(0, -1); renderPin(); }
  });

  if (!fsSupported) {
    fsBtn.hidden = true;
  } else {
    fsBtn.addEventListener('click', function () {
      try {
        if (isFs()) {
          openPin();                                  // code needed to leave
        } else {
          var p = (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot);
          // Where supported (Chrome/Edge), make Esc need a long press to exit
          if (p && p.then) p.then(function () {
            try { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['Escape']); } catch (e) {}
          }).catch(function () {});
        }
      } catch (e) {}
    });
    document.addEventListener('fullscreenchange', updateFs);
    document.addEventListener('webkitfullscreenchange', updateFs);
  }

  function tick() {
    var d = new Date();
    var nowSec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();

    $('clock').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()) + '<small>:' + pad(d.getSeconds()) + '</small>';
    $('date').textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

    // New day: the tick resets itself automatically.
    if (todayStr(d) !== currentDay) {
      currentDay = todayStr(d);
      reg = loadReg();
      renderReg();
      // New week: food board starts fresh automatically.
      var wk = weekStart(d);
      if (wk !== currentWeek) {
        currentWeek = wk;
        renderFood();
      }
    }
    renderEvents(nowSec);
    if (++fitTicks % 10 === 0) scheduleFit(); // catches long event titles etc.
  }

  // ---------- content ----------
  function loadContent() {
    return fetch('content/hub.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.register_url) {
          registerUrl = data.register_url;
          regBtn.href = registerUrl;
        }
        events = prepareEvents(data.events);
        buildSchedule();
        tick();
        scheduleFit();
      })
      .catch(function () { /* keep showing what we already have */ });
  }

  buildSchedule();
  renderReg();
  renderFood();
  tick();
  setInterval(tick, 1000);
  loadContent();
  setInterval(loadContent, 5 * 60 * 1000); // pick up CMS edits without a reload
})();
</script>

</body>
</html>
